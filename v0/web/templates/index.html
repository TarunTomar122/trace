<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f7f6f3;
            --bg-hover: #efefef;
            --bg-active: #e8e7e4;
            --text: #37352f;
            --text-secondary: #787774;
            --text-muted: #9b9a97;
            --border: #e9e9e7;
            --divider: #edece9;
            
            --red: #e03e3e;
            --red-bg: #ffe2dd;
            --orange: #d9730d;
            --orange-bg: #fadec9;
            --yellow: #cb912f;
            --yellow-bg: #fdecc8;
            --green: #0f7b6c;
            --green-bg: #dbeddb;
            --blue: #0b6e99;
            --blue-bg: #d3e5ef;
            --purple: #6940a5;
            --purple-bg: #e8deee;
            --pink: #ad1a72;
            --pink-bg: #f5e0e9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .app {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 240px;
            padding: 1rem;
            border-right: 1px solid var(--divider);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-secondary);
        }
        
        .sidebar-header {
            padding: 0.5rem 0.75rem;
            margin-bottom: 1rem;
        }
        
        .sidebar-logo {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .sidebar-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.125rem;
        }
        
        .user-selector {
            margin: 0 0.5rem 1.5rem;
            padding: 0.5rem;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .user-selector-label {
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.625rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        
        .user-item:hover {
            background: var(--bg-hover);
        }
        
        .user-item.active {
            background: var(--blue-bg);
            border: 1px solid var(--blue);
        }
        
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--purple-bg);
            color: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }
        
        .user-item.active .user-avatar {
            background: var(--blue);
            color: white;
        }
        
        .user-info {
            flex: 1;
            min-width: 0;
        }
        
        .user-name {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .user-role {
            font-size: 0.6875rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .sidebar-section {
            margin-bottom: 1.5rem;
        }
        
        .sidebar-title {
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 0.75rem;
            margin-bottom: 0.25rem;
        }
        
        .date-list {
            display: flex;
            flex-direction: column;
        }
        
        .date-item {
            display: flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.12s;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        
        .date-item:hover {
            background: var(--bg-hover);
        }
        
        .date-item.active {
            background: var(--bg-hover);
            color: var(--text);
            font-weight: 500;
        }
        
        .date-item .date-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            margin-right: 0.625rem;
        }
        
        .date-item.active .date-dot {
            background: var(--blue);
        }
        
        .filter-list {
            display: flex;
            flex-direction: column;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.12s;
            user-select: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        
        .filter-item:hover {
            background: var(--bg-hover);
        }
        
        .filter-item.active {
            background: var(--bg-hover);
        }
        
        .filter-label {
            font-size: 0.875rem;
            flex: 1;
            color: var(--text-secondary);
        }
        
        .filter-item.active .filter-label {
            color: var(--text);
            font-weight: 500;
        }
        
        .filter-count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .type-indicator {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }
        
        .type-indicator.repo { background: var(--yellow-bg); border: 1px solid var(--yellow); }
        .type-indicator.paper { background: var(--purple-bg); border: 1px solid var(--purple); }
        .type-indicator.video { background: var(--red-bg); border: 1px solid var(--red); }
        .type-indicator.blog { background: var(--blue-bg); border: 1px solid var(--blue); }
        .type-indicator.discussion { background: var(--orange-bg); border: 1px solid var(--orange); }
        .type-indicator.tweet { background: var(--blue-bg); border: 1px solid var(--blue); }
        .type-indicator.launch { background: var(--pink-bg); border: 1px solid var(--pink); }
        .type-indicator.model { background: var(--green-bg); border: 1px solid var(--green); }
        
        .sidebar-actions {
            padding: 0.5rem 0.75rem;
            margin-top: 1rem;
        }
        
        .sidebar-btn {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.12s;
            margin-bottom: 0.375rem;
            text-align: left;
        }
        
        .sidebar-btn:hover {
            background: var(--bg-hover);
        }
        
        .sidebar-btn.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }
        
        .sidebar-btn.primary:hover {
            opacity: 0.85;
        }
        
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            max-width: 680px;
            margin: 0 auto;
            margin-left: calc(240px + (100vw - 240px - 680px) / 2);
        }
        
        @media (max-width: 1100px) {
            .main-content {
                margin-left: 240px;
                margin-right: 2rem;
            }
        }
        
        .feed-header {
            margin-bottom: 1.5rem;
        }
        
        .feed-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        
        .feed-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .feed-list {
            display: flex;
            flex-direction: column;
        }
        
        .feed-item {
            padding: 0.875rem 0;
            border-bottom: 1px solid var(--divider);
        }
        
        .feed-item:first-child {
            padding-top: 0;
        }
        
        .feed-item:last-child {
            border-bottom: none;
        }
        
        .feed-item.hidden {
            display: none;
        }
        
        .item-header {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            margin-bottom: 0.375rem;
        }
        
        .item-type {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            border-radius: 3px;
            font-size: 0.6875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            flex-shrink: 0;
            margin-top: 0.1875rem;
        }
        
        .item-type.video { background: var(--red-bg); color: var(--red); }
        .item-type.paper { background: var(--purple-bg); color: var(--purple); }
        .item-type.repo { background: var(--yellow-bg); color: var(--yellow); }
        .item-type.blog { background: var(--blue-bg); color: var(--blue); }
        .item-type.discussion { background: var(--orange-bg); color: var(--orange); }
        .item-type.tweet { background: var(--blue-bg); color: var(--blue); }
        .item-type.launch { background: var(--pink-bg); color: var(--pink); }
        .item-type.model { background: var(--green-bg); color: var(--green); }
        
        .item-title {
            font-size: 0.9375rem;
            font-weight: 500;
            flex: 1;
            line-height: 1.4;
        }
        
        .item-title a {
            color: inherit;
            text-decoration: none;
        }
        
        .item-title a:hover {
            text-decoration: underline;
        }
        
        .item-actions {
            display: flex;
            gap: 0.125rem;
            opacity: 0;
            transition: opacity 0.12s;
        }
        
        .feed-item:hover .item-actions,
        .item-actions:has(.voted),
        .item-actions:has(.starred) {
            opacity: 1;
        }
        
        .vote-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .vote-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
        
        .vote-btn.upvote:hover,
        .vote-btn.upvote.voted {
            background: var(--green-bg);
            color: var(--green);
        }
        
        .vote-btn.downvote:hover,
        .vote-btn.downvote.voted {
            background: var(--red-bg);
            color: var(--red);
        }
        
        .vote-btn.star:hover,
        .vote-btn.star.starred {
            background: var(--yellow-bg);
            color: var(--yellow);
        }
        
        .item-description {
            color: var(--text-secondary);
            font-size: 0.8125rem;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        
        .item-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .item-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            margin-bottom: 0.5rem;
        }
        
        .item-tag {
            font-size: 0.6875rem;
            padding: 0.125rem 0.5rem;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 3px;
        }
        
        .item-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        
        .empty-state h2 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text);
        }
        
        .empty-state p {
            font-size: 0.875rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
                margin-right: 0;
                padding: 1.5rem;
            }
        }
        
        /* Inline note input */
        .note-input-row {
            display: none;
            margin-top: 0.5rem;
            gap: 0.5rem;
            align-items: flex-start;
        }
        
        .note-input-row.active {
            display: flex;
        }
        
        .note-input {
            flex: 1;
            padding: 0.5rem 0.625rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8125rem;
            background: var(--bg);
            color: var(--text);
            resize: none;
            min-height: 32px;
            max-height: 80px;
        }
        
        .note-input:focus {
            outline: none;
            border-color: var(--blue);
        }
        
        .note-input::placeholder {
            color: var(--text-muted);
        }
        
        .note-submit {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .note-submit:hover {
            background: var(--bg-hover);
        }
        
        .note-display {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 0.375rem;
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">Trace</div>
                <div class="sidebar-subtitle">Your personalized feed</div>
            </div>
            
            <div class="user-selector">
                <span class="user-selector-label">Select Profile</span>
                <div class="user-list" id="user-list">
                    <!-- Users populated by JS -->
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">Dates</div>
                <div class="date-list" id="date-list">
                    <!-- Dates populated by JS -->
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">Filter by Type</div>
                <div class="filter-list" id="filter-list">
                    <!-- Filters populated by JS -->
                </div>
            </div>
            
            <div class="sidebar-section">
                <button class="date-item" id="starred-btn" onclick="showStarred()" style="display: none;">
                    <span style="margin-right: 0.625rem;">⭐</span>
                    <span>Starred</span>
                    <span class="filter-count" id="starred-count" style="margin-left: auto;">0</span>
                </button>
            </div>
            
        </aside>
        
        <main class="main-content">
            <div class="feed-header">
                <h1 id="feed-title">Today's Feed</h1>
                <p id="feed-subtitle">Curated content based on your interests</p>
            </div>
            <div id="feed-container">
                <div class="loading">Loading</div>
            </div>
        </main>
    </div>
    
    <script>
        let currentUser = null;
        let availableUsers = [];
        let currentDate = new Date().toISOString().split('T')[0];
        let availableDates = [];
        let allItems = [];
        let activeFilter = 'all';
        let typeCounts = {};
        let votedItems = {};
        let downvoteNotes = {};
        let starredItems = {};
        let starredList = [];
        let viewingStarred = false;
        
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                availableUsers = data.users;
                
                renderUserList();
                
                // Select first user by default
                if (availableUsers.length > 0) {
                    selectUser(availableUsers[0].id);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }
        
        function renderUserList() {
            const container = document.getElementById('user-list');
            container.innerHTML = '';
            
            availableUsers.forEach(user => {
                const btn = document.createElement('button');
                btn.className = 'user-item' + (user.id === currentUser ? ' active' : '');
                btn.innerHTML = `
                    <div class="user-avatar">${user.name.charAt(0).toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-role">${user.role}</div>
                    </div>
                `;
                btn.onclick = () => selectUser(user.id);
                container.appendChild(btn);
            });
        }
        
        async function selectUser(userId) {
            currentUser = userId;
            viewingStarred = false;
            renderUserList();
            
            // Update subtitle with user name
            const user = availableUsers.find(u => u.id === userId);
            if (user) {
                document.getElementById('feed-subtitle').textContent = `Feed for ${user.name}`;
            }
            
            // Load starred items and dates for this user
            await Promise.all([loadStarred(), loadDates()]);
        }
        
        async function loadStarred() {
            try {
                const response = await fetch(`/api/starred?user=${currentUser}`);
                const data = await response.json();
                starredList = data.items || [];
                
                // Build lookup
                starredItems = {};
                starredList.forEach(item => {
                    starredItems[item.id] = true;
                });
                
                // Update starred button
                const starredBtn = document.getElementById('starred-btn');
                const starredCount = document.getElementById('starred-count');
                if (starredList.length > 0) {
                    starredBtn.style.display = 'flex';
                    starredCount.textContent = starredList.length;
                } else {
                    starredBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading starred:', error);
            }
        }
        
        async function showStarred() {
            viewingStarred = true;
            document.getElementById('feed-title').textContent = '⭐ Starred Items';
            document.getElementById('feed-subtitle').textContent = `${starredList.length} saved items`;
            
            // Clear date selection
            document.querySelectorAll('.date-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('starred-btn').classList.add('active');
            
            // Render starred items
            const container = document.getElementById('feed-container');
            if (starredList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No starred items</h2>
                        <p>Star items you want to save for later</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="feed-list"></div>';
            const feedList = container.querySelector('.feed-list');
            starredList.forEach(item => {
                feedList.appendChild(createFeedItem(item, true));
            });
        }
        
        async function toggleStar(itemId, item) {
            const isStarred = starredItems[itemId];
            const action = isStarred ? 'unstar' : 'star';
            
            try {
                const response = await fetch('/api/star', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: currentUser,
                        item: item,
                        action: action
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (action === 'star') {
                        starredItems[itemId] = true;
                    } else {
                        delete starredItems[itemId];
                    }
                    
                    // Update button state
                    const btn = document.querySelector(`button.star[data-id="${itemId}"]`);
                    if (btn) {
                        btn.classList.toggle('starred', action === 'star');
                    }
                    
                    // Reload starred list
                    await loadStarred();
                    
                    // If viewing starred, re-render
                    if (viewingStarred) {
                        showStarred();
                    }
                }
            } catch (error) {
                console.error('Error toggling star:', error);
            }
        }
        
        async function loadDates() {
            try {
                const response = await fetch(`/api/dates?user=${currentUser}`);
                const data = await response.json();
                availableDates = data.dates;
                
                renderDateList();
                
                // Load today's feed or the most recent one
                if (availableDates.length > 0) {
                    const today = new Date().toISOString().split('T')[0];
                    if (availableDates.includes(today)) {
                        loadFeed(today);
                    } else {
                        loadFeed(availableDates[0]); // Most recent
                    }
                } else {
                    document.getElementById('feed-container').innerHTML = `
                        <div class="empty-state">
                            <h2>No feeds yet</h2>
                            <p>Generate a feed using: python agent.py generate users/${currentUser}</p>
                        </div>
                    `;
                    // Clear filters
                    document.getElementById('filter-list').innerHTML = '';
                }
            } catch (error) {
                console.error('Error loading dates:', error);
            }
        }
        
        function renderDateList() {
            const container = document.getElementById('date-list');
            container.innerHTML = '';
            
            availableDates.forEach(dateStr => {
                const date = new Date(dateStr + 'T00:00:00');
                const today = new Date().toISOString().split('T')[0];
                
                let label;
                if (dateStr === today) {
                    label = 'Today';
                } else {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    if (dateStr === yesterday.toISOString().split('T')[0]) {
                        label = 'Yesterday';
                    } else {
                        label = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    }
                }
                
                const btn = document.createElement('button');
                btn.className = 'date-item' + (dateStr === currentDate ? ' active' : '');
                btn.innerHTML = `<span class="date-dot"></span>${label}`;
                btn.onclick = () => loadFeed(dateStr);
                container.appendChild(btn);
            });
        }
        
        async function loadFeed(date) {
            currentDate = date;
            viewingStarred = false;
            renderDateList();
            
            // Clear starred button active state
            document.getElementById('starred-btn').classList.remove('active');
            
            const dateObj = new Date(date + 'T00:00:00');
            const today = new Date().toISOString().split('T')[0];
            
            let title;
            if (date === today) {
                title = "Today's Feed";
            } else {
                title = dateObj.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    month: 'long', 
                    day: 'numeric'
                });
            }
            document.getElementById('feed-title').textContent = title;
            
            try {
                const [feedResponse, interactionsResponse] = await Promise.all([
                    fetch(`/api/feed?user=${currentUser}&date=${date}`),
                    fetch(`/api/interactions?user=${currentUser}&date=${date}`)
                ]);
                
                const feedData = await feedResponse.json();
                const interactionsData = await interactionsResponse.json();
                
                allItems = feedData.items;
                votedItems = interactionsData.interactions || {};
                downvoteNotes = interactionsData.notes || {};
                
                typeCounts = {};
                allItems.forEach(item => {
                    typeCounts[item.type] = (typeCounts[item.type] || 0) + 1;
                });
                
                buildFilters();
                renderFeed();
                
            } catch (error) {
                console.error('Error loading feed:', error);
                document.getElementById('feed-container').innerHTML = `
                    <div class="empty-state">
                        <h2>Unable to load feed</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        function buildFilters() {
            const container = document.getElementById('filter-list');
            container.innerHTML = '';
            
            activeFilter = 'all'; // Reset to all
            
            // Add "All" option first
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-item active';
            allBtn.dataset.filter = 'all';
            allBtn.innerHTML = `
                <span class="filter-label">All</span>
                <span class="filter-count">${allItems.length}</span>
            `;
            allBtn.onclick = () => setFilter('all');
            container.appendChild(allBtn);
            
            // Add each type
            Object.keys(typeCounts).sort().forEach(type => {
                const count = typeCounts[type];
                const btn = document.createElement('button');
                btn.className = 'filter-item';
                btn.dataset.filter = type;
                btn.innerHTML = `
                    <span class="type-indicator ${type}"></span>
                    <span class="filter-label">${type.charAt(0).toUpperCase() + type.slice(1)}</span>
                    <span class="filter-count">${count}</span>
                `;
                btn.onclick = () => setFilter(type);
                container.appendChild(btn);
            });
        }
        
        function setFilter(filter) {
            activeFilter = filter;
            
            // Update active state
            document.querySelectorAll('.filter-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            
            renderFeed();
        }
        
        function renderFeed() {
            const container = document.getElementById('feed-container');
            
            if (allItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No feed for this date</h2>
                        <p>Generate a feed using: python agent.py generate users/${currentUser}</p>
                    </div>
                `;
                return;
            }
            
            const filteredItems = activeFilter === 'all' 
                ? allItems 
                : allItems.filter(item => item.type === activeFilter);
            
            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No matching items</h2>
                        <p>Try a different filter</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="feed-list"></div>';
            const feedList = container.querySelector('.feed-list');
            
            filteredItems.forEach(item => {
                feedList.appendChild(createFeedItem(item));
            });
        }
        
        function formatNumber(num) {
            if (!num) return null;
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        function createFeedItem(item, isStarredView = false) {
            const div = document.createElement('div');
            div.className = 'feed-item';
            div.dataset.type = item.type;
            
            // Rewrite arxiv URLs to Emergent Mind
            let itemUrl = item.url;
            if (item.type === 'paper' && item.url && item.url.includes('arxiv.org')) {
                const arxivMatch = item.url.match(/arxiv\.org\/abs\/(\d+\.\d+)/);
                if (arxivMatch) {
                    itemUrl = `https://www.emergentmind.com/papers/${arxivMatch[1]}`;
                }
            }
            
            let thumbnailHTML = '';
            if (item.thumbnail && item.type === 'video') {
                thumbnailHTML = `<img src="${item.thumbnail}" class="item-thumbnail" alt="" loading="lazy">`;
            }
            
            let metaItems = [];
            if (item.source) {
                metaItems.push(`<span>${item.source}</span>`);
            }
            if (item.stars) {
                metaItems.push(`<span>★ ${formatNumber(item.stars)}</span>`);
            }
            if (item.view_count) {
                metaItems.push(`<span>${formatNumber(item.view_count)} views</span>`);
            }
            
            const metaHTML = metaItems.length > 0 
                ? `<div class="item-meta">${metaItems.join('')}</div>` 
                : '';
            
            const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
            const currentVote = votedItems[item.id];
            const upvoteClass = currentVote === 'upvote' ? 'voted' : '';
            const downvoteClass = currentVote === 'downvote' ? 'voted' : '';
            const isStarred = starredItems[item.id];
            const starClass = isStarred ? 'starred' : '';
            const noteText = downvoteNotes[item.id];
            const noteDisplay = noteText ? `<div class="note-display">"${noteText}"</div>` : '';
            const showNoteInput = currentVote === 'downvote' && !noteText;
            
            // Build tags HTML
            const tagsHTML = item.tags && item.tags.length > 0
                ? `<div class="item-tags">${item.tags.map(t => `<span class="item-tag">${t}</span>`).join('')}</div>`
                : '';
            
            div.innerHTML = `
                <div class="item-header">
                    <h2 class="item-title">
                        <a href="${itemUrl}" target="_blank" rel="noopener">${item.title}</a>
                    </h2>
                    <div class="item-actions">
                        <button class="vote-btn star ${starClass}" data-id="${item.id}" onclick="toggleStar('${item.id}', ${itemJson})" title="Star">★</button>
                        <button class="vote-btn upvote ${upvoteClass}" onclick="vote('${item.id}', 'upvote', ${itemJson})" title="Upvote">↑</button>
                        <button class="vote-btn downvote ${downvoteClass}" onclick="vote('${item.id}', 'downvote', ${itemJson})" title="Downvote">↓</button>
                    </div>
                </div>
                ${tagsHTML}
                ${thumbnailHTML}
                <p class="item-description">${item.description || ''}</p>
                ${metaHTML}
                ${noteDisplay}
                <div class="note-input-row ${showNoteInput ? 'active' : ''}" id="note-row-${item.id}">
                    <input type="text" class="note-input" id="note-input-${item.id}" placeholder="Why? (optional)" onkeydown="handleNoteKey(event, '${item.id}', ${itemJson})">
                    <button class="note-submit" onclick="submitNote('${item.id}', ${itemJson})">Add note</button>
                </div>
            `;
            
            return div;
        }
        
        async function vote(itemId, action, itemMetadata) {
            // Toggle off if clicking same vote again
            const currentVote = votedItems[itemId];
            const isToggleOff = currentVote === action;
            
            try {
                const response = await fetch('/api/interact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: currentUser,
                        item_id: itemId,
                        action: isToggleOff ? 'remove' : action,
                        item_metadata: itemMetadata,
                        feed_date: currentDate
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (isToggleOff) {
                        delete votedItems[itemId];
                        delete downvoteNotes[itemId];
                    } else {
                        votedItems[itemId] = action;
                    }
                    updateVoteButtons(itemId, isToggleOff ? null : action);
                    
                    // Show note input for downvotes
                    const noteRow = document.getElementById(`note-row-${itemId}`);
                    if (noteRow) {
                        if (action === 'downvote' && !isToggleOff && !downvoteNotes[itemId]) {
                            noteRow.classList.add('active');
                            document.getElementById(`note-input-${itemId}`)?.focus();
                        } else {
                            noteRow.classList.remove('active');
                        }
                    }
                }
            } catch (error) {
                console.error('Error recording vote:', error);
            }
        }
        
        function handleNoteKey(event, itemId, itemMetadata) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitNote(itemId, itemMetadata);
            }
        }
        
        async function submitNote(itemId, itemMetadata) {
            const input = document.getElementById(`note-input-${itemId}`);
            const note = input?.value.trim();
            
            if (!note) {
                // Just hide if empty
                document.getElementById(`note-row-${itemId}`)?.classList.remove('active');
                return;
            }
            
            try {
                const response = await fetch('/api/interact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user: currentUser,
                        item_id: itemId,
                        action: 'downvote',
                        item_metadata: itemMetadata,
                        feed_date: currentDate,
                        note: note
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    downvoteNotes[itemId] = note;
                    // Re-render to show the note
                    renderFeed();
                }
            } catch (error) {
                console.error('Error saving note:', error);
            }
        }
        
        function updateVoteButtons(itemId, action) {
            const buttons = document.querySelectorAll(`button[onclick*="${itemId}"]`);
            buttons.forEach(btn => {
                btn.classList.remove('voted');
                if (action && btn.classList.contains(action)) {
                    btn.classList.add('voted');
                }
            });
        }
        
        async function generateFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loading">Generating feed</div>';
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user: currentUser })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    setTimeout(() => {
                        loadDates();
                    }, 2000);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>Generation failed</h2>
                            <p>${data.error || 'Unknown error'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error generating feed:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Error</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function triggerReflection() {
            if (!confirm('Analyze today\'s interactions and update preferences?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reflect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user: currentUser })
                });
                
                const data = await response.json();
                alert('Reflection complete');
            } catch (error) {
                console.error('Error running reflection:', error);
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
