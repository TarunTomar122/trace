          - generic [ref=e221]:
            - paragraph [ref=e222]: NVIDIA has unveiled Cosmos-H-Dreams, a real-time generative simulator that enhances surgical robotics by allowing interactive control in a closed loop. Building on the capabilities of the Cosmos-H-Surgical-Simulator, this new model can generate surgical scenes in real-time, operating at approximately 160 frames per second on a single NVIDIA RTX PRO 6000 GPU. It distills complex surgical dynamics into a more efficient framework, enabling faster evaluations and synthetic data generation. The system has been integrated with the Versius surgeon controller from CMR Surgical, marking a significant advancement in surgical simulation technology.
