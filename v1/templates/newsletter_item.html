<!--
    NEWSLETTER ITEM TEMPLATE

    Placeholders:
    - {{ITEM_URL}}: Link to the article
    - {{ITEM_TITLE}}: Article title
    - {{ITEM_SUMMARY}}: Structured HTML summary
    - {{ITEM_TYPE_LABEL}}: Type badge text (BLOG, NEWS, etc.)
    - {{ITEM_TYPE_COLOR}}: Badge accent color
    - {{ITEM_IMAGE_HTML}}: Article thumbnail (pre-rendered HTML or empty)
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 0;">
    <!-- Separator line -->
    <tr>
        <td style="padding: 0 0 24px 0;">
            <div style="border-top: 1px solid #e4e4e7;"></div>
        </td>
    </tr>
    <tr>
        <td>
            <!-- Type badge -->
            <div style="margin-bottom: 8px;">
                <span style="display: inline-block; font-size: 10px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: {{ITEM_TYPE_COLOR}}; text-transform: uppercase; letter-spacing: 1.2px;">
                    {{ITEM_TYPE_LABEL}}
                </span>
            </div>
            <!-- Title -->
            <a href="{{ITEM_URL}}" style="display: block; margin-bottom: 12px; font-size: 19px; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: #18181b; text-decoration: none; line-height: 1.35;">
                {{ITEM_TITLE}}
            </a>
            <!-- Article image (only present when available) -->
            {{ITEM_IMAGE_HTML}}
            <!-- Summary body -->
            <div style="font-size: 15px; color: #3f3f46; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.65; margin-bottom: 14px;">
                {{ITEM_SUMMARY}}
            </div>
            <!-- Read more link -->
            <a href="{{ITEM_URL}}" style="display: inline-block; font-size: 13px; font-weight: 600; color: {{ITEM_TYPE_COLOR}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-decoration: none;">
                Read more &rarr;
            </a>
        </td>
    </tr>
    <!-- Bottom spacing -->
    <tr>
        <td style="height: 24px;"></td>
    </tr>
</table>
