name: User Onboard (v3)

on:
  repository_dispatch:
    types: [user-onboard]
  
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Firebase UID of the user'
        required: true
        type: string

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  build-user-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Resolve user ID
        id: uid
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "user_id=${{ github.event.client_payload.user_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "user_id=${{ inputs.user_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build v1/v2 feed (web app)
        run: |
          echo "Running v1 onboard hook for user: ${{ steps.uid.outputs.user_id }}"
          python -u v1/hooks/on_user_onboard.py --user_id "${{ steps.uid.outputs.user_id }}"

      - name: Build v3 feed (mobile app)
        run: |
          echo "Building v3 feed for user: ${{ steps.uid.outputs.user_id }}"
          python -u -m v3.scheduler --jobs all --user-id "${{ steps.uid.outputs.user_id }}"

