name: Daily Pipeline
# IST = UTC + 5:30 | Target: Complete before 10 AM IST

on:
  schedule:
    # Reflection at 5:00 AM IST (11:30 PM UTC previous day)
    # Runs: Daily Reflection → Cleanup expired signals
    # Processes previous day's interactions
    - cron: '30 23 * * *'

    # Content pipeline at 8:00 AM IST (2:30 AM UTC)
    # Runs: Topics → Feeds → Newsletters (build + send)
    - cron: '30 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - evening
          - batch
          - feeds
          - newsletters
          - build_newsletters
          - build_free_newsletter
          - send_newsletters
          - send_free_newsletter
          - reflection
          - cleanup

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  morning-pipeline:
    if: github.event.schedule == '30 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || inputs.jobs == 'morning' || inputs.jobs == 'batch' || inputs.jobs == 'feeds' || inputs.jobs == 'newsletters' || inputs.jobs == 'build_newsletters' || inputs.jobs == 'build_free_newsletter' || inputs.jobs == 'send_newsletters' || inputs.jobs == 'send_free_newsletter'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run morning jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python v1/scheduler.py --jobs ${{ inputs.jobs }}
          else
            python v1/scheduler.py --jobs morning
          fi

  evening-pipeline:
    if: github.event.schedule == '30 23 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || inputs.jobs == 'evening' || inputs.jobs == 'reflection' || inputs.jobs == 'cleanup'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run evening jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python v1/scheduler.py --jobs ${{ inputs.jobs }}
          else
            python v1/scheduler.py --jobs evening
          fi

