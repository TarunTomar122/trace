name: Daily Pipeline
# IST = UTC + 5:30

on:
  schedule:
    # Morning pipeline at 8:00 AM IST (2:30 AM UTC) - full build
    - cron: '30 2 * * *'

    # Trending refreshes every 3 hours, 24x7 (offset from other jobs)
    - cron: '20 */3 * * *'

    # Push notifications (morning & evening)
    - cron: '30 3 * * *'   # 9:00 AM IST - morning notification
    - cron: '30 14 * * *'  # 8:00 PM IST - evening notification
  
  workflow_dispatch:
    inputs:
      jobs:
        description: 'v3 jobs to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pools
          - feeds
          - for_you
          - trending
          - assemble
      audience:
        description: 'Audience segment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - subscribed
          - unsubscribed

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  morning-pipeline:
    if: github.event.schedule == '30 2 * * *' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run morning jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python -u -m v3.scheduler --jobs ${{ inputs.jobs }} --audience ${{ inputs.audience }}
          else
            python -u -m v3.scheduler --jobs for_you --audience all
            python -u -m v3.scheduler --jobs trending assemble --audience all
          fi

  trending-refresh:
    # Run only on the 24x7 trending refresh cadence
    if: github.event.schedule == '20 */3 * * *' && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Refresh trending and rebuild feeds
        run: |
          python -u -m v3.scheduler --jobs trending assemble --audience all --force-pools

  # Push notifications - morning (9 AM IST) and evening (8 PM IST)
  push-notification:
    if: github.event.schedule == '30 3 * * *' || github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Send trending push notification
        run: |
          python -u -m v2.flows.send_push_notification --type trending
