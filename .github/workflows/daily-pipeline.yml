name: Daily Pipeline
# IST = UTC + 5:30 | Target: Complete before 6 AM IST (12:30 AM UTC)

on:
  schedule:
    # Reflection at 9:00 AM IST (03:30 AM UTC)
    # Runs: Daily Reflection → Cleanup expired signals
    # Processes previous day's interactions
    - cron: '30 3 * * *'

    # Content pipeline at 10:00 AM IST (04:30 AM UTC)
    # Runs: Trend Discovery → Pool Harvest → Feed Generation
    # Takes ~30 mins, completes by ~10:30 AM IST
    - cron: '30 4 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run (all/morning/evening/batch/feeds/reflection/cleanup)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - evening
          - batch
          - feeds
          - reflection
          - cleanup

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

jobs:
  morning-pipeline:
    if: github.event.schedule == '30 22 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || inputs.jobs == 'morning' || inputs.jobs == 'batch' || inputs.jobs == 'feeds'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run morning jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python v1/scheduler.py --jobs ${{ inputs.jobs }}
          else
            python v1/scheduler.py --jobs morning
          fi

  evening-pipeline:
    if: github.event.schedule == '0 17 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || inputs.jobs == 'evening' || inputs.jobs == 'reflection' || inputs.jobs == 'cleanup'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run evening jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python v1/scheduler.py --jobs ${{ inputs.jobs }}
          else
            python v1/scheduler.py --jobs evening
          fi

