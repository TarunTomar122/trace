name: Daily Pipeline
# IST = UTC + 5:30

on:
  schedule:
    # Morning pipeline at 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'

    # Afternoon trending refresh at 2:30 PM IST (9:00 AM UTC)
    - cron: '0 9 * * *'
  
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pool
          - learning
          - trending
          - feeds
          - insights
          - weekly_wrap
          - newsletters
          - newsletter_build
          - newsletter_send

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  morning-pipeline:
    if: github.event.schedule == '30 2 * * *' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run morning jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python -u v2/scheduler_firestore.py --jobs ${{ inputs.jobs }} --items-per-user 8
          else
            python -u v2/scheduler_firestore.py --jobs all --items-per-user 8
          fi

  afternoon-trending:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Refresh trending and rebuild feeds
        run: |
          python -u v2/scheduler_firestore.py --jobs trending --items-per-user 8
          python -u v2/scheduler_firestore.py --jobs feeds --items-per-user 8
