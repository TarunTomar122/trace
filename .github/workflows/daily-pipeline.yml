name: Daily Pipeline
# IST = UTC + 5:30

on:
  schedule:
    # Morning pipeline at 8:00 AM IST (2:30 AM UTC) - full build
    - cron: '30 2 * * *'

    # Trending refreshes every 3 hours, 24x7 (offset from other jobs)
    - cron: '20 */3 * * *'

    # Pulse refreshes hourly with fresh reads, tools, and discussions
    - cron: '5 * * * *'

    # Push notifications (morning only)
    - cron: '30 3 * * *'   # 9:00 AM IST - morning notification
  
  workflow_dispatch:
    inputs:
      jobs:
        description: 'v3 jobs to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pools
          - feeds
          - for_you
          - pulse
          - trending
          - assemble
      audience:
        description: 'Audience segment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - subscribed
          - unsubscribed

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

# The pipeline lives in backend/ (v1/v2/v3 packages, requirements.txt).
defaults:
  run:
    working-directory: backend

jobs:
  morning-pipeline:
    if: github.event.schedule == '30 2 * * *' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: trace-pulse-generation
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run morning jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python -u -m v3.scheduler --jobs ${{ inputs.jobs }} --audience ${{ inputs.audience }}
          else
            python -u -m v3.scheduler --jobs for_you --audience all
            python -u -m v3.scheduler --jobs pulse --audience all
            python -u -m v3.scheduler --jobs trending --audience all --skip-notifications
          fi

  pulse-refresh:
    if: github.event.schedule == '5 * * * *' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: trace-pulse-generation
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Refresh Pulse
        run: |
          python -u -m v3.scheduler --jobs pulse --audience all --force-pools

  trending-refresh:
    # Run only on the 24x7 trending refresh cadence
    if: github.event.schedule == '20 */3 * * *' && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Refresh trending only
        run: |
          python -u -m v3.scheduler --jobs trending --audience all --force-pools --skip-notifications

  # Push notifications - morning (9 AM IST)
  push-notification:
    if: github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Send trending push notification
        run: |
          python -u -m v2.flows.send_push_notification --type trending
