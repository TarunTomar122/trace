name: User Unsubscribe

on:
  repository_dispatch:
    types: [user-unsubscribe]

  workflow_dispatch:
    inputs:
      user_id:
        description: 'User ID to unmap'
        required: true
        type: string

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

# The pipeline lives in backend/ (v1/v2/v3 packages, requirements.txt).
defaults:
  run:
    working-directory: backend

jobs:
  unmap-user:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unmap script
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            USER_ID="${{ github.event.client_payload.user_id }}"
          else
            USER_ID="${{ inputs.user_id }}"
          fi
          echo "Unsubscribing user: $USER_ID"
          python v1/flows/unsubscribe_user.py --user_id "$USER_ID"

