name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: node --test lib/feed-ranking.test.mjs lib/same-event.test.mjs lib/feed-story-dedupe.test.mjs lib/email-visit.test.mjs lib/big-things.test.mjs lib/retention.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      # Includes the Python <-> TypeScript newsletter selection parity check (needs node).
      - run: python -m unittest discover -s v3 -p "test_*.py" -t .
      - run: python -m unittest discover -s tests
