name: Daily Newsletter

on:
  # The scheduled send lives on the VPS (trace-newsletter.timer at
  # 10:30 Europe/Berlin) — GitHub cron fires hours late in practice.
  # This workflow stays for manual/replay sends.
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Newsletter jobs to run'
        required: true
        default: 'newsletter'
        type: choice
        options:
          - newsletter
          - newsletter_build
          - newsletter_send
      audience:
        description: 'Audience segment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - subscribed
          - unsubscribed

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

# The pipeline lives in backend/ (v1/v2/v3 packages, requirements.txt).
defaults:
  run:
    working-directory: backend

jobs:
  newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run newsletter jobs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python -u -m v3.scheduler --jobs ${{ inputs.jobs }} --audience ${{ inputs.audience }}
          else
            python -u -m v3.scheduler --jobs newsletter --audience all
          fi
