<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }
    .header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg { opacity: 0.7; }
    .status {
      padding: 12px;
      border-radius: 8px;
      background: #2a2a2a;
      margin-bottom: 16px;
    }
    .status.running { border-left: 3px solid #065fd4; }
    .status.ready { border-left: 3px solid #2ba640; }
    .status.error { border-left: 3px solid #e53935; }
    .status-text { font-size: 14px; margin-bottom: 4px; }
    .status-detail { font-size: 12px; color: #999; }
    .progress-bar {
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #065fd4;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #666;
    }
    .step.active { color: #fff; }
    .step.done { color: #2ba640; }
    .step-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: #333;
      flex-shrink: 0;
    }
    .step.active .step-icon { background: #065fd4; }
    .step.done .step-icon { background: #2ba640; }
    .chat-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2ba640;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      display: none;
    }
    .chat-btn:hover { background: #238a35; }
    .chat-btn.visible { display: block; }
    .retry-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      display: none;
    }
    .retry-btn:hover { background: #555; }
    .retry-btn.visible { display: block; }
    .no-video {
      text-align: center;
      color: #666;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="8" r="4"/>
      <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
    </svg>
    Avatar Creator
  </div>

  <div id="no-video" class="no-video" style="display:none">
    Open a YouTube video to create an avatar
  </div>

  <div id="status-container">
    <div id="status" class="status">
      <div id="status-text" class="status-text">Loading...</div>
      <div id="status-detail" class="status-detail"></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
    </div>

    <div id="steps" class="steps">
      <div class="step" data-step="1"><div class="step-icon">1</div>Extract transcript</div>
      <div class="step" data-step="2"><div class="step-icon">2</div>Extract faces</div>
      <div class="step" data-step="3"><div class="step-icon">3</div>Analyze speaker</div>
      <div class="step" data-step="4"><div class="step-icon">4</div>Extract voice clip</div>
      <div class="step" data-step="5"><div class="step-icon">5</div>Clone voice</div>
      <div class="step" data-step="6"><div class="step-icon">6</div>Create avatar</div>
    </div>

    <button id="chat-btn" class="chat-btn">Open Chat</button>
    <button id="retry-btn" class="retry-btn">Retry</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
