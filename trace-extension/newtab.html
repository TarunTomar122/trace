<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>New Tab · Trace</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://www.yourtrace.online/feed" target="_blank" rel="noopener noreferrer" aria-label="Open Trace">
        <span class="brand-word">Trace</span>
        <img src="assets/icon48.png" width="22" height="22" alt="">
      </a>
      <nav class="topics" id="topics" aria-label="Topics"></nav>
      <a class="account-link" id="account-link" target="_blank" rel="noopener noreferrer">Sign in</a>
    </header>

    <main class="page">
      <div class="grid loading" id="loading" aria-label="Loading stories">
        <div class="skeleton is-lead"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="grid" id="stories" hidden></div>
      <div class="error" id="error" hidden role="alert">
        <span id="error-message">Could not load stories.</span>
        <button id="retry" type="button">Try again</button>
      </div>
      <footer class="foot">
        <a href="https://www.yourtrace.online/?utm_source=extension&amp;utm_medium=footer" target="_blank" rel="noopener noreferrer">Get the daily email, free</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.yourtrace.online/feed?sponsor=open" target="_blank" rel="noopener noreferrer">Sponsor Trace</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.yourtrace.online/contact" target="_blank" rel="noopener noreferrer">Feedback</a>
      </footer>
    </main>

    <dialog class="reader" id="reader" aria-labelledby="reader-title">
      <div class="reader-bar">
        <span class="reader-kicker" id="reader-kicker"></span>
        <div class="reader-tools">
          <button id="reader-bookmark" class="icon-button" type="button" aria-label="Save story" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21z"/></svg>
          </button>
          <button id="reader-share" class="icon-button" type="button" aria-label="Copy story link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
          </button>
          <button id="reader-close" class="icon-button" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <article class="reader-body">
        <img id="reader-image" class="reader-image" alt="">
        <h1 id="reader-title"></h1>
        <p class="meta" id="reader-meta"></p>
        <div class="reader-text" id="reader-text"></div>
        <div class="more" id="reader-more" hidden>
          <p class="more-label">More on this story</p>
          <ul id="reader-coverage"></ul>
        </div>
        <div class="reader-actions">
          <a id="reader-trace" class="button-primary" target="_blank" rel="noopener noreferrer">Open on Trace <span aria-hidden="true">↗</span></a>
          <a id="reader-source" class="button-quiet" target="_blank" rel="noopener noreferrer">Read the source <span aria-hidden="true">↗</span></a>
        </div>
      </article>
    </dialog>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
