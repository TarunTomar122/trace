<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Trace New Tab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <a class="brand" href="https://www.yourtrace.online" aria-label="Open Trace">
        <img src="assets/icon48.png" width="28" height="28" alt="">
        <span>TRACE</span>
      </a>
      <nav class="filters" id="filters" aria-label="Filter stories"></nav>
    </header>

    <main>
      <div class="loading-grid" id="loading" aria-label="Loading articles"></div>
      <div class="article-grid" id="articles" hidden></div>
      <div class="error" id="error" hidden role="alert">
        <span id="error-message">Could not load articles.</span>
        <button id="retry" type="button">Try again</button>
      </div>
    </main>

    <template id="feedback-card">
      <article class="article-card feedback-card">
        <a class="article-open" href="https://www.yourtrace.online/contact" target="_blank" rel="noopener noreferrer">
          <span class="feedback-visual"><img src="assets/icon128.png" width="64" height="64" alt=""></span>
          <span class="article-content">
            <span class="story-tag">Feedback</span>
            <span class="article-title">Help us make Trace worth a five-star Chrome Web Store review.</span>
            <span class="feedback-action">Share feedback ↗</span>
          </span>
        </a>
      </article>
    </template>

    <dialog class="reader" id="reader" aria-labelledby="reader-title">
      <div class="reader-hero">
        <img id="reader-image" alt="">
        <button id="reader-close" type="button" aria-label="Close full read">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <article>
        <h1 id="reader-title"></h1>
        <div class="reader-body" id="reader-body"></div>
        <ul id="reader-takeaways"></ul>
        <div class="reader-actions">
          <a id="reader-link" target="_blank" rel="noopener noreferrer">Read original source <span aria-hidden="true">↗</span></a>
          <p class="reader-source" id="reader-source"></p>
        </div>
      </article>
    </dialog>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
