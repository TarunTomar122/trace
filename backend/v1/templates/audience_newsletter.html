<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace: {{SUBJECT}}</title>
    <style>
        /* Phones get the full screen: no outer gutter, no card frame, and a
           tighter text column so lines are not cramped by padding. */
        @media only screen and (max-width: 680px) {
            .nl-outer { padding: 0 !important; }
            .nl-card {
                max-width: 100% !important;
                border-radius: 0 !important;
                border-left: 0 !important;
                border-right: 0 !important;
            }
            .nl-p28 { padding-left: 16px !important; padding-right: 16px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff;">
        <tr>
            <td class="nl-outer" align="center" style="padding: 28px 12px;">
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 680px; background-color: #ffffff; border: 1px solid #dbe4e8; border-radius: 16px; overflow: hidden;" class="nl-card">

                    <!-- Header -->
                    <tr>
                        <td class="nl-p28" style="padding: 20px 28px 16px 28px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="vertical-align: middle;">
                                        <a href="https://yourtrace.online/feed?from=email" style="text-decoration: none;">
                                            <span style="font-size: 15px; color: #0f1419; font-weight: 800; letter-spacing: 0.18em; text-decoration: none;">TRACE</span>
                                        </a>
                                    </td>
                                    <td align="right" style="vertical-align: middle;">
                                        <span style="font-size: 12px; color: #71767b; font-weight: 500;">{{DATE}}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Headline + intro -->
                    <tr>
                        <td class="nl-p28" style="padding: 4px 28px 8px 28px;">
                            <p style="margin: 0; font-size: 21px; color: #0f1419; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3;">{{HEADLINE}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td class="nl-p28" style="padding: 0 28px 6px 28px;">
                            <p style="margin: 0; font-size: 15px; color: #536471; line-height: 1.6;">{{INTRO}}</p>
                        </td>
                    </tr>

                    <!-- Stories: each section emits its own row so the
                         model-release panel can run edge to edge. -->
                    {{SECTIONS_HTML}}

                    <!-- CTA -->
                    <tr>
                        <td class="nl-p28" style="padding: 10px 28px 24px 28px;">
                            {{CTA_HTML}}
                        </td>
                    </tr>
                    <!-- /CTA -->

                    <!-- FEEDBACK -->
                    <tr>
                        <td class="nl-p28" style="padding: 0 28px 24px 28px;">
                            {{FEEDBACK_HTML}}
                        </td>
                    </tr>
                    <!-- /FEEDBACK -->

                    <!-- Footer -->
                    <tr>
                        <td class="nl-p28" style="padding: 20px 28px; border-top: 1px solid #eff3f4;">
                            <p style="margin: 0 0 6px 0; font-size: 12.5px; color: #71767b; line-height: 1.6;">
                                Trace reads 400+ sources overnight and hands you the stories that matter.
                            </p>
                            <p style="margin: 0; font-size: 12.5px; color: #71767b; line-height: 1.6;">
                                {{FOOTER_LINKS}}
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="margin: 14px 0 0 0; font-size: 11.5px; color: #8b98a5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Built by Tarat · © 2026 Trace</p>
            </td>
        </tr>
    </table>
</body>
</html>
